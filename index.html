
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Truly Tarantulas</title>

    <style>
        /* GENERAL PAGE STYLING */
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            margin: 0;
        }

        body {
            width: 100%;
            margin: 0;
            padding: 10px;
            background-color: #000000;
            color: #F2E8D5;
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            font-weight: normal;
        }

        /* LOGO */
        .logo {
            display: block;
            width: 100%;
            max-width: 650px;
            height: auto;
            margin: 0 auto;
        }

        /* TAGLINE */
        .tagline {
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            line-height: 1.5;
            margin: 6px 0 20px;
        }

        /* NAVIGATION CONTAINER */
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;

            width: 100%;
            padding: 4px 0;
            margin: 0;

            background: transparent;
            border: none;
        }

        /* INDIVIDUAL NAVIGATION BUTTONS */
        .navbar a {
            display: inline-block;
            flex: 0 1 auto;
            max-width: 100%;

            padding: 4px 6px;

            color: #D9B96E;
            background: linear-gradient(
                180deg,
                #781C2C 0%,
                #58101E 50%,
                #300810 100%
            );

            border: 3px double #C6A15B;
            border-radius: 0;
            box-shadow: none;

            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            font-weight: normal;
            text-align: center;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: background 0.3s ease,
                        color 0.3s ease;
        }

        /* BUTTON HOVER */
        .navbar a:hover {
            color: #FFE6A0;

            background: linear-gradient(
                180deg,
                #A52A40 0%,
                #681525 50%,
                #400B17 100%
            );

            border-color: #F0D38A;
        }

        /* HIDE CURRENT PAGE BUTTON */
        .navbar a.current-page {
            display: none;
        }

        /* DIVIDER */
        hr {
            border: none;
            border-top: 1px solid #C6A15B;
            margin: 18px 0;
        }

        /* TABLES */
        .table-wrapper,
        .table-container {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            border-collapse: collapse;
        }

        img {
            max-width: 100%;
            height: auto;
        }

    
        * {
    box-sizing: border-box;
}

html {
    width: 100%;
    -webkit-text-size-adjust: 100%;
}

body {
    max-width: 100%;
    margin: 0;
    padding: 10px;
}

/* Keep images and logo inside the screen */
img {
    max-width: 100%;
    height: auto;
}

/* Allow navigation buttons to wrap onto multiple lines */
.navbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 100%;
}

.navbar a {
    max-width: 100%;
    text-align: center;
}

/* Make tables scroll horizontally when necessary */
div[style*="overflow-x:auto"] {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

/* Adjust everything for phones */
@media screen and (max-width: 600px) {
    body {
        padding: 2px;
        font-size: 11px;
    }

    h1 {
        font-size: 12px;
    }

    h2 {
        font-size: 8px;
    }

    h3 {
        font-size: 6px;
    }

    p, li {
        font-size: 8px;
    }

    .logo {
        width: 100%;
        max-width: 350px;
        height: auto;
    }

    .navbar {
        gap: 1px;
    }

    .navbar a {
        font-size: 8px;
        padding: 2px 2px;
    }

    table {
        font-size: 8px;
    }

    th, td {
        padding: 1px 2px;
    }
}

/* Extra-small phones */
@media screen and (max-width: 380px) {
    h1 {
        font-size: 8px;
    }

    .navbar a {
        font-size: 8px;
        padding: 1px;
    }
}


    </style>
</head>
